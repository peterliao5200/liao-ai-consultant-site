<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鏡面人生 - 給未來的你一個參考</title>
    <style>
        :root {
            --bg-deep: #0a0a14;
            --bg-card: rgba(20, 18, 40, 0.85);
            --gold: #c9a96e;
            --gold-light: #e8d5a3;
            --gold-dark: #8b6914;
            --jade: #5b8c5a;
            --jade-light: #8fbc8f;
            --text: #e8e0d0;
            --text-dim: #9998a8;
            --red: #c0392b;
            --red-light: #e74c3c;
            --water: #4a90d9;
            --fire: #e0503c;
            --wood: #5b8c5a;
            --earth: #c9a040;
            --metal: #d4c8a8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: "Noto Serif TC", "STSong", "SimSun", "KaiTi", "微軟正黑體", "Microsoft JhengHei", serif;
            background: var(--bg-deep);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.8;
        }

        #starfield {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }

        .container {
            position: relative; z-index: 1;
            max-width: 860px; margin: 0 auto; padding: 2rem 1.5rem;
        }

        /* ── Header ── */
        .header {
            text-align: center; padding: 3rem 0 2rem;
        }
        .header .decor {
            width: 80px; height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 0 auto 1.2rem;
        }
        .header h1 {
            font-size: 2.6rem; font-weight: 400;
            background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dark) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 0.15em;
            margin-bottom: 0.4rem;
        }
        .header .subtitle {
            font-size: 1rem; color: var(--text-dim);
            letter-spacing: 0.1em;
        }
        .header .subtitle::before { content: "「 "; color: var(--gold); }
        .header .subtitle::after { content: " 」"; color: var(--gold); }

        /* ── Form Section ── */
        .section-card {
            background: var(--bg-card);
            border: 1px solid rgba(201, 169, 110, 0.2);
            border-radius: 16px;
            padding: 2rem 2.2rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.03);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .section-card:hover {
            box-shadow: 0 12px 50px rgba(0, 0, 0, 0.5),
                        0 0 30px rgba(201, 169, 110, 0.08),
                        inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .section-title {
            font-size: 1.25rem; color: var(--gold);
            letter-spacing: 0.12em;
            margin-bottom: 1.5rem;
            display: flex; align-items: center; gap: 0.6rem;
        }
        .section-title::before {
            content: ''; display: inline-block;
            width: 6px; height: 6px;
            background: var(--gold); border-radius: 50%;
            box-shadow: 0 0 10px var(--gold);
        }

        .form-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
        }
        .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .form-group.full { grid-column: 1 / -1; }
        .form-group label {
            font-size: 0.85rem; color: var(--text-dim);
            letter-spacing: 0.06em;
        }
        .form-group input,
        .form-group select {
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(201, 169, 110, 0.3);
            border-radius: 10px;
            color: var(--text);
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(201, 169, 110, 0.15);
        }
        .form-group select { cursor: pointer; }
        .form-group select option {
            background: #1a1830; color: var(--text);
        }

        .btn-primary {
            display: block; width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, var(--gold-dark), var(--gold), var(--gold-dark));
            color: #0a0a14;
            border: none; border-radius: 12px;
            font-size: 1.1rem; font-family: inherit;
            letter-spacing: 0.12em;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(201, 169, 110, 0.25);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(201, 169, 110, 0.4);
        }
        .btn-primary:active { transform: translateY(0); }

        .btn-secondary {
            display: block; width: 100%;
            padding: 0.8rem;
            background: transparent;
            color: var(--gold);
            border: 1px solid rgba(201, 169, 110, 0.4);
            border-radius: 12px;
            font-size: 0.95rem; font-family: inherit;
            letter-spacing: 0.08em;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-secondary:hover {
            background: rgba(201, 169, 110, 0.1);
            border-color: var(--gold);
        }

        /* ── Results Section ── */
        #results { display: none; }
        #results.show { display: block; animation: fadeInUp 0.8s ease-out; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes floatPillar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .pillars-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin: 1.5rem 0 2rem;
        }

        .pillar-card {
            background: var(--bg-card);
            border: 1px solid rgba(201, 169, 110, 0.2);
            border-radius: 16px;
            padding: 1.5rem 0.8rem;
            text-align: center;
            animation: floatPillar 4s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }
        .pillar-card:nth-child(1) { animation-delay: 0s; }
        .pillar-card:nth-child(2) { animation-delay: 0.3s; }
        .pillar-card:nth-child(3) { animation-delay: 0.6s; }
        .pillar-card:nth-child(4) { animation-delay: 0.9s; }
        .pillar-card::before {
            content: ''; position: absolute;
            bottom: 0; left: 50%; transform: translateX(-50%);
            width: 60%; height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            opacity: 0.5;
        }
        .pillar-card .pillar-label {
            font-size: 0.75rem; color: var(--text-dim);
            letter-spacing: 0.08em; margin-bottom: 0.5rem;
        }
        .pillar-card .pillar-stem {
            font-size: 2.4rem; font-weight: 700;
            color: var(--gold-light);
            line-height: 1.2;
            display: block;
        }
        .pillar-card .pillar-branch {
            font-size: 2.4rem; font-weight: 700;
            color: var(--gold);
            line-height: 1.2;
            display: block;
        }
        .pillar-card .pillar-element {
            font-size: 0.75rem; color: var(--text-dim);
            margin-top: 0.3rem;
            letter-spacing: 0.06em;
        }
        .pillar-card .pillar-zodiac {
            font-size: 0.8rem; color: var(--gold);
            margin-top: 0.2rem;
        }

        /* Day Master highlight */
        .pillar-card.day-master {
            border-color: var(--gold);
            box-shadow: 0 0 25px rgba(201, 169, 110, 0.15);
        }
        .pillar-card.day-master::after {
            content: '日主'; position: absolute;
            top: 0.4rem; right: 0.6rem;
            font-size: 0.6rem; color: var(--gold);
            letter-spacing: 0.1em;
            background: rgba(201, 169, 110, 0.15);
            padding: 0.1rem 0.4rem; border-radius: 8px;
        }

        /* ── Five Elements Chart ── */
        .elements-section {
            display: flex; flex-direction: column; gap: 1.5rem;
        }
        .elements-chart-wrap {
            width: 100%; max-width: 480px; margin: 0 auto;
        }
        .elements-chart-wrap svg { width: 100%; height: auto; }

        .element-bars {
            display: flex; flex-direction: column; gap: 0.6rem;
            margin-top: 0.5rem;
        }
        .element-bar-row {
            display: flex; align-items: center; gap: 0.8rem;
        }
        .element-bar-label {
            width: 2rem; font-size: 0.9rem; color: var(--text-dim);
            text-align: center;
        }
        .element-bar-track {
            flex: 1; height: 10px; background: rgba(255,255,255,0.06);
            border-radius: 5px; overflow: hidden;
        }
        .element-bar-fill {
            height: 100%; border-radius: 5px;
            transition: width 1.5s ease-out;
        }
        .element-bar-fill.wood { background: linear-gradient(90deg, var(--wood), #7db87d); }
        .element-bar-fill.fire { background: linear-gradient(90deg, var(--fire), #ff6b5b); }
        .element-bar-fill.earth { background: linear-gradient(90deg, var(--earth), #e8c96a); }
        .element-bar-fill.metal { background: linear-gradient(90deg, var(--metal), #e8dcc8); }
        .element-bar-fill.water { background: linear-gradient(90deg, var(--water), #7ab4f0); }
        .element-bar-count {
            width: 1.5rem; font-size: 0.85rem; color: var(--text-dim);
            text-align: right;
        }

        /* ── Interpretation ── */
        .interpret-block {
            margin-bottom: 1.5rem;
        }
        .interpret-block h3 {
            font-size: 1.05rem; color: var(--gold);
            letter-spacing: 0.08em;
            margin-bottom: 0.6rem;
            padding-left: 0.8rem;
            border-left: 3px solid var(--gold);
        }
        .interpret-block p {
            font-size: 0.95rem; color: var(--text);
            line-height: 2;
            padding: 0 0.8rem;
        }
        .highlight {
            color: var(--gold-light); font-weight: 700;
        }
        .tag {
            display: inline-block;
            font-size: 0.75rem;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            margin: 0 0.2rem;
            letter-spacing: 0.06em;
        }
        .tag.good { background: rgba(91,140,90,0.2); color: var(--jade-light); border: 1px solid rgba(91,140,90,0.3); }
        .tag.note { background: rgba(201,169,110,0.12); color: var(--gold-light); border: 1px solid rgba(201,169,110,0.3); }
        .tag.warn { background: rgba(192,57,43,0.15); color: var(--red-light); border: 1px solid rgba(192,57,43,0.3); }

        .hidden-stems {
            display: flex; flex-wrap: wrap; gap: 0.5rem;
            margin-top: 0.8rem;
        }
        .hidden-stem-item {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; padding: 0.3rem 0.7rem;
            font-size: 0.85rem; color: var(--text-dim);
        }

        /* ── Ten Gods ── */
        .ten-gods-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.6rem;
            margin-top: 0.8rem;
        }
        .ten-god-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px; padding: 0.8rem 0.5rem;
            text-align: center;
            font-size: 0.8rem;
        }
        .ten-god-card .god-name {
            font-size: 0.9rem; color: var(--gold-light);
            font-weight: 700; margin-bottom: 0.2rem;
        }
        .ten-god-card .god-stem { color: var(--text-dim); font-size: 0.75rem; }

        /* ── Luck Cycles ── */
        .luck-table {
            width: 100%; border-collapse: collapse;
            margin-top: 0.8rem; font-size: 0.85rem;
        }
        .luck-table th, .luck-table td {
            padding: 0.5rem 0.6rem; text-align: center;
            border-bottom: 1px solid rgba(201, 169, 110, 0.1);
        }
        .luck-table th {
            color: var(--gold); font-weight: 400;
            letter-spacing: 0.06em; font-size: 0.75rem;
        }
        .luck-table tr.current {
            background: rgba(201, 169, 110, 0.08);
        }
        .luck-table tr.current td {
            color: var(--gold-light); font-weight: 700;
        }

        /* ── Footer ── */
        .footer {
            text-align: center; padding: 2.5rem 0 1.5rem;
            color: var(--text-dim); font-size: 0.8rem;
            letter-spacing: 0.06em;
        }
        .footer .divider {
            width: 40px; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(201,169,110,0.4), transparent);
            margin: 0 auto 1rem;
        }

        /* ── Disclaimer Block ── */
        .disclaimer {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px; padding: 1rem 1.2rem;
            font-size: 0.78rem; color: var(--text-dim);
            line-height: 1.8; margin-top: 1rem;
        }

        .result-meta {
            font-size: 0.85rem; color: var(--text-dim);
            text-align: center; margin-bottom: 0.5rem;
        }
        .result-meta span { color: var(--gold); }

        /* ── Responsive ── */
        @media (max-width: 600px) {
            .container { padding: 1rem; }
            .header h1 { font-size: 2rem; }
            .form-grid { grid-template-columns: 1fr; }
            .pillars-grid { grid-template-columns: repeat(2, 1fr); }
            .ten-gods-grid { grid-template-columns: repeat(2, 1fr); }
            .pillar-card .pillar-stem,
            .pillar-card .pillar-branch { font-size: 1.8rem; }
            .section-card { padding: 1.5rem 1.2rem; }
        }
    </style>
</head>
<body>

<canvas id="starfield"></canvas>

<div class="container">
    <header class="header">
        <div class="decor"></div>
        <h1>鏡面人生</h1>
        <p class="subtitle">給未來的你一個參考</p>
    </header>

    <!-- Input Form -->
    <section class="section-card" id="input-section">
        <div class="section-title">輸入生辰資訊</div>
        <div class="form-grid">
            <div class="form-group">
                <label>姓氏 / 暱稱</label>
                <input type="text" id="name" placeholder="選填">
            </div>
            <div class="form-group">
                <label>性別</label>
                <select id="gender">
                    <option value="male">男</option>
                    <option value="female">女</option>
                </select>
            </div>
            <div class="form-group">
                <label>出生日期（西曆）</label>
                <input type="date" id="birthdate" required>
            </div>
            <div class="form-group">
                <label>出生時辰</label>
                <select id="birthtime">
                    <option value="0">子時 23:00-01:00（深夜）</option>
                    <option value="1">丑時 01:00-03:00（凌晨）</option>
                    <option value="2">寅時 03:00-05:00（黎明）</option>
                    <option value="3">卯時 05:00-07:00（清晨）</option>
                    <option value="4">辰時 07:00-09:00（早晨）</option>
                    <option value="5">巳時 09:00-11:00（上午）</option>
                    <option value="6">午時 11:00-13:00（正午）</option>
                    <option value="7">未時 13:00-15:00（午後）</option>
                    <option value="8">申時 15:00-17:00（下午）</option>
                    <option value="9">酉時 17:00-19:00（傍晚）</option>
                    <option value="10">戌時 19:00-21:00（黃昏）</option>
                    <option value="11">亥時 21:00-23:00（入夜）</option>
                    <option value="-1">未知時辰（不排時柱）</option>
                </select>
            </div>
        </div>
        <div style="margin-top: 1.5rem;">
            <button class="btn-primary" onclick="calculate()" id="calc-btn">
                ✦ 排盤解讀 ✦
            </button>
        </div>
        <p class="result-meta" style="margin-top: 0.8rem; font-size: 0.75rem;">
            本排盤使用農曆節氣月令，非數字月份。立春為歲首。
        </p>
    </section>

    <!-- Results Section -->
    <section id="results">
        <!-- Four Pillars -->
        <div class="section-card">
            <div class="section-title">四柱八字命盤</div>
            <div class="pillars-grid" id="pillars-grid"></div>
            <div id="na-yin-row" class="result-meta" style="margin-top:0.5rem;"></div>
        </div>

        <!-- Hidden Stems -->
        <div class="section-card" id="hidden-stems-card">
            <div class="section-title">地支藏干</div>
            <div id="hidden-stems-content"></div>
        </div>

        <!-- Five Elements -->
        <div class="section-card">
            <div class="section-title">五行能量分布</div>
            <div class="elements-section">
                <div class="elements-chart-wrap" id="chart-container"></div>
                <div class="element-bars" id="element-bars"></div>
                <div id="elements-advice" style="margin-top:1rem;"></div>
            </div>
        </div>

        <!-- Ten Gods -->
        <div class="section-card">
            <div class="section-title">十神關係（以日主為中心）</div>
            <div class="ten-gods-grid" id="ten-gods-grid"></div>
        </div>

        <!-- Day Master -->
        <div class="section-card" id="day-master-card">
            <div class="section-title">日主解讀</div>
            <div id="day-master-interpretation"></div>
        </div>

        <!-- Luck Cycles -->
        <div class="section-card" id="luck-card">
            <div class="section-title">大運流年</div>
            <div id="luck-content"></div>
        </div>

        <!-- Overall Guidance -->
        <div class="section-card">
            <div class="section-title">人生建議</div>
            <div id="life-guidance"></div>
        </div>

        <div style="text-align:center; margin-top:1.5rem;">
            <button class="btn-secondary" onclick="resetCalc()">重新排盤</button>
        </div>

        <div class="disclaimer">
            ⚠️ 本工具僅供娛樂參考，命理分析非精密科學。八字排盤基於傳統算法，節氣以近似日期計算（誤差 ±1 日）。
            人生道路由你掌握，請勿過度依賴命理判斷。鏡面人生，映照的始終是你自己的選擇。
        </div>
    </section>

    <footer class="footer">
        <div class="divider"></div>
        鏡面人生 · 給未來的你一個參考
    </footer>
</div>

<script>
/* =============================================================
   CONSTANTS
   ============================================================= */
const STEMS = ['甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬', '癸'];
const BRANCHES = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];
const ZODIAC_MAP = { 子:'鼠', 丑:'牛', 寅:'虎', 卯:'兔', 辰:'龍', 巳:'蛇', 午:'馬', 未:'羊', 申:'猴', 酉:'雞', 戌:'狗', 亥:'豬' };
const BRANCH_ELEMENTS = {
    寅:'木', 卯:'木',
    巳:'火', 午:'火',
    申:'金', 酉:'金',
    亥:'水', 子:'水',
    丑:'土', 辰:'土', 未:'土', 戌:'土'
};
const STEM_ELEMENTS = {
    甲:'木', 乙:'木',
    丙:'火', 丁:'火',
    戊:'土', 己:'土',
    庚:'金', 辛:'金',
    壬:'水', 癸:'水'
};
// 5虎遁: 年干→寅月天干 base
const TIGER_BASE = [2, 4, 6, 8, 0]; // [甲/己, 乙/庚, 丙/辛, 丁/壬, 戊/癸]
// 5鼠遁: 日干→子時天干 base
const RAT_BASE = [0, 2, 4, 6, 8]; // [甲/己, 乙/庚, 丙/辛, 丁/壬, 戊/癸]

const NA_YIN = [
    '海中金','爐中火','大林木','路旁土','劍鋒金','山頭火',
    '澗下水','城頭土','白蠟金','楊柳木','泉中水','屋上土',
    '霹靂火','松柏木','流年水','砂石金','山下火','平地木',
    '壁上土','金箔金','覆燈火','天河水','大驛土','釵釧金',
    '桑柘木','大溪水','沙中土','天上火','石榴木','大海水'
];

// 藏干
const HIDDEN_STEMS = {
    '子': ['癸'],
    '丑': ['己','癸','辛'],
    '寅': ['甲','丙','戊'],
    '卯': ['乙'],
    '辰': ['戊','乙','癸'],
    '巳': ['丙','庚','戊'],
    '午': ['丁','己'],
    '未': ['己','丁','乙'],
    '申': ['庚','壬','戊'],
    '酉': ['辛'],
    '戌': ['戊','辛','丁'],
    '亥': ['壬','甲']
};

// Solar term approximate dates (month, day)
const SOLAR_TERMS = [
    { m:2, d:4 },  // 立春 → 寅月 start
    { m:3, d:6 },  // 驚蟄 → 卯月
    { m:4, d:5 },  // 清明 → 辰月
    { m:5, d:6 },  // 立夏 → 巳月
    { m:6, d:6 },  // 芒種 → 午月
    { m:7, d:7 },  // 小暑 → 未月
    { m:8, d:8 },  // 立秋 → 申月
    { m:9, d:8 },  // 白露 → 酉月
    { m:10,d:8 },  // 寒露 → 戌月
    { m:11,d:7 },  // 立冬 → 亥月
    { m:12,d:7 },  // 大雪 → 子月
    { m:1, d:6 }   // 小寒 → 丑月
];

/* =============================================================
   CALCULATION FUNCTIONS
   ============================================================= */

// Julian Day Number for Gregorian date
function getJDN(y, m, d) {
    if (m <= 2) { y--; m += 12; }
    const A = Math.floor(y / 100);
    const B = 2 - A + Math.floor(A / 4);
    return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524;
}

// Get solar term month index (0=寅, 1=卯, ..., 11=丑)
function getSolarMonth(y, m, d) {
    for (let i = 0; i < 12; i++) {
        const st = SOLAR_TERMS[i];
        if (m < st.m || (m === st.m && d < st.d)) {
            // Before this solar term, use previous month
            const prev = (i - 1 + 12) % 12;
            return prev;
        }
    }
    // After 小寒 (Jan 6), still in 丑月
    return 11;
}

// Get BaZi year (adjust for 立春)
function getBaziYear(y, m, d) {
    // If before 立春 (~Feb 4), it's still the previous year
    if (m < 2 || (m === 2 && d < 4)) return y - 1;
    return y;
}

// Calculate year pillar (60-cycle)
function getYearPillar(baziYear) {
    const idx = (baziYear - 4) % 60;
    const stemIdx = idx % 10;
    const branchIdx = idx % 12;
    return { stem: STEMS[stemIdx], branch: BRANCHES[branchIdx], stemIdx, branchIdx };
}

// Calculate month pillar
function getMonthPillar(yearStemIdx, solarMonthIdx) {
    // 5虎遁: base = TIGER_BASE[yearStemIdx % 5]
    const base = TIGER_BASE[yearStemIdx % 5];
    // 寅月=index 0, 卯月=1, ..., 丑月=11
    const monthStemIdx = (base + solarMonthIdx) % 10;
    const monthBranchIdx = (2 + solarMonthIdx) % 12; // 寅=2
    return { stem: STEMS[monthStemIdx], branch: BRANCHES[monthBranchIdx], stemIdx: monthStemIdx, branchIdx: monthBranchIdx };
}

// Calculate day pillar
function getDayPillar(y, m, d) {
    const jdn = getJDN(y, m, d);
    const stemIdx = ((jdn % 10) + 9) % 10; // Ensure positive
    const branchIdx = ((jdn % 12) + 1) % 12;
    return { stem: STEMS[stemIdx], branch: BRANCHES[branchIdx], stemIdx, branchIdx };
}

// Calculate hour pillar
function getHourPillar(dayStemIdx, hourBranchIdx) {
    if (hourBranchIdx < 0) return null;
    const base = RAT_BASE[dayStemIdx % 5];
    const hourStemIdx = (base + hourBranchIdx) % 10;
    return { stem: STEMS[hourStemIdx], branch: BRANCHES[hourBranchIdx], stemIdx: hourStemIdx, branchIdx: hourBranchIdx };
}

/* =============================================================
   ELEMENT ANALYSIS
   ============================================================= */
function countElements(pillars) {
    const count = { 木:0, 火:0, 土:0, 金:0, 水:0 };
    pillars.forEach(p => {
        if (!p) return;
        count[STEM_ELEMENTS[p.stem]]++;
        count[BRANCH_ELEMENTS[p.branch]]++;
        // Also count hidden stems
        const hidden = HIDDEN_STEMS[p.branch] || [];
        hidden.forEach(hs => { count[STEM_ELEMENTS[hs]] += 0.5; });
    });
    return count;
}

function countElementsPlain(pillars) {
    const count = { 木:0, 火:0, 土:0, 金:0, 水:0 };
    pillars.forEach(p => {
        if (!p) return;
        count[STEM_ELEMENTS[p.stem]]++;
        count[BRANCH_ELEMENTS[p.branch]]++;
    });
    return count;
}

/* =============================================================
   TEN GODS (十神)
   ============================================================= */
function getTenGod(dayStemIdx, otherStemIdx) {
    // dayStem 的五行: dayElem, otherStem 的五行: otherElem
    const ELEM_ORDER = ['木','火','土','金','水'];
    const dayElem = STEM_ELEMENTS[STEMS[dayStemIdx]];
    const otherElem = STEM_ELEMENTS[STEMS[otherStemIdx]];
    const dayElemIdx = ELEM_ORDER.indexOf(dayElem);
    const otherElemIdx = ELEM_ORDER.indexOf(otherElem);

    // Same: 比肩/劫財
    if (dayElemIdx === otherElemIdx) {
        return (otherStemIdx % 2 === dayStemIdx % 2) ? '比肩' : '劫財';
    }
    // Resource (生我): (dayElemIdx + 4) % 5
    if ((dayElemIdx + 4) % 5 === otherElemIdx) {
        return (otherStemIdx % 2 === dayStemIdx % 2) ? '偏印' : '正印';
    }
    // Output (我生): (dayElemIdx + 1) % 5
    if ((dayElemIdx + 1) % 5 === otherElemIdx) {
        return (otherStemIdx % 2 === dayStemIdx % 2) ? '食神' : '傷官';
    }
    // Wealth (我剋): (dayElemIdx + 2) % 5
    if ((dayElemIdx + 2) % 5 === otherElemIdx) {
        return (otherStemIdx % 2 === dayStemIdx % 2) ? '偏財' : '正財';
    }
    // Power (剋我): (dayElemIdx + 3) % 5
    if ((dayElemIdx + 3) % 5 === otherElemIdx) {
        return (otherStemIdx % 2 === dayStemIdx % 2) ? '七殺' : '正官';
    }
    return '—';
}

/* =============================================================
   NA YIN (納音)
   ============================================================= */
function getNaYin(stemIdx, branchIdx) {
    const cycleIdx = (stemIdx * 6 + branchIdx * 5) % 60;
    return NA_YIN[Math.floor(cycleIdx / 2)];
}

/* =============================================================
   LUCK CYCLES (大運)
   ============================================================= */
function getLuckCycles(baziYear, monthStemIdx, monthBranchIdx, gender, isBeforeLichun, bdayJDN) {
    const isYangStem = monthStemIdx % 2 === 0; // 甲丙戊庚壬
    const isMale = gender === 'male';

    // Forward = yang male or yin female
    const forward = (isYangStem && isMale) || (!isYangStem && !isMale);

    // Calculate starting age: count days to nearest solar term
    let startAge = 1;
    // Find nearest solar term in the right direction
    const birthDate = new Date(baziYear, 0, 1);
    // Approximate: use solar term dates
    if (forward) {
        // Count to next solar term
        for (let i = 0; i < 12; i++) {
            const stM = SOLAR_TERMS[i].m;
            const stD = SOLAR_TERMS[i].d;
            const stDate = new Date(baziYear + (stM < 2 ? 1 : 0), stM - 1, stD);
            if (stDate > birthDate) {
                startAge = Math.max(1, Math.floor((stDate - birthDate) / (86400000 * 3)));
                break;
            }
        }
    } else {
        // Count to previous solar term
        for (let i = 11; i >= 0; i--) {
            const stM = SOLAR_TERMS[i].m;
            const stD = SOLAR_TERMS[i].d;
            const stDate = new Date(baziYear + (stM > 9 ? -1 : 0), stM - 1, stD);
            if (stDate < birthDate) {
                startAge = Math.max(1, Math.floor((birthDate - stDate) / (86400000 * 3)));
                break;
            }
        }
    }

    // Generate 8 luck cycles (10 years each)
    const cycles = [];
    let mStem = monthStemIdx, mBranch = monthBranchIdx;
    for (let i = 0; i < 8; i++) {
        mStem = forward ? (mStem + 1) % 10 : (mStem - 1 + 10) % 10;
        mBranch = forward ? (mBranch + 1) % 12 : (mBranch - 1 + 12) % 12;
        const ageFrom = startAge + i * 10;
        cycles.push({
            stem: STEMS[mStem],
            branch: BRANCHES[mBranch],
            ageFrom, ageTo: ageFrom + 9
        });
    }
    return cycles;
}

function calculate() {
    const name = document.getElementById('name').value.trim() || '有緣人';
    const gender = document.getElementById('gender').value;
    const birthdate = document.getElementById('birthdate').value;
    const birthtime = parseInt(document.getElementById('birthtime').value);

    if (!birthdate) {
        alert('請輸入出生日期。');
        return;
    }

    const [y, m, d] = birthdate.split('-').map(Number);
    const baziYear = getBaziYear(y, m, d);
    const solarMonthIdx = getSolarMonth(y, m, d);

    // Calculate four pillars
    const yearP = getYearPillar(baziYear);
    const monthP = getMonthPillar(yearP.stemIdx, solarMonthIdx);
    const dayP = getDayPillar(y, m, d);
    const hourP = (birthtime >= 0) ? getHourPillar(dayP.stemIdx, birthtime) : null;

    const pillars = [yearP, monthP, dayP, hourP].filter(Boolean);
    const pillarsValid = [yearP, monthP, dayP, hourP];

    // Element counts
    const elemCount = countElements(pillarsValid);
    const elemCountPlain = countElementsPlain(pillarsValid);

    // Display results
    displayPillars(pillarsValid, name);
    displayHiddenStems(pillarsValid);
    displayElementsChart(elemCountPlain);
    displayElementBars(elemCountPlain);
    displayElementsAdviceSection(dayP.stem, elemCount);
    displayTenGods(dayP, pillarsValid);
    displayDayMaster(dayP.stem);
    displayLuckCycles(baziYear, monthP, gender, y, m, d);
    displayLifeGuidance(elemCount);

    // Scroll to results
    document.getElementById('results').classList.add('show');
    setTimeout(() => {
        document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 200);
}

            html += `<span class="hidden-stem-item">${hs}（${STEM_ELEMENTS[hs]}）</span>`;
        });
        html += `</p>`;
    });
    container.innerHTML = html;
}

function displayElementsChart(count) {
    const container = document.getElementById('chart-container');
    const elements = ['木','火','土','金','水'];
    const total = Object.values(count).reduce((a,b) => a+b, 0);
    const maxVal = Math.max(...Object.values(count), 1);

    // Radar-like display using polar SVG
    const cx = 220, cy = 220, outerR = 160;
    const angles = [-90, -90 + 72, -90 + 144, -90 + 216, -90 + 288].map(a => a * Math.PI / 180);

    let svg = `<svg viewBox="0 0 440 440" xmlns="http://www.w3.org/2000/svg">`;

    // Grid rings
    for (let r = 1; r <= 4; r++) {
        const rr = outerR * r / 4;
        const pts = angles.map(a => `${cx + rr * Math.cos(a)},${cy + rr * Math.sin(a)}`).join(' ');
        svg += `<polygon points="${pts}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>`;
    }

    // Grid lines
    angles.forEach(a => {
        svg += `<line x1="${cx}" y1="${cy}" x2="${cx + outerR * Math.cos(a)}" y2="${cy + outerR * Math.sin(a)}" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>`;
    });

    // Data polygon
    const dataPts = elements.map((e, i) => {
        const r = (count[e] / Math.max(maxVal, 1)) * outerR;
        return `${cx + r * Math.cos(angles[i])},${cy + r * Math.sin(angles[i])}`;
    }).join(' ');
    svg += `<polygon points="${dataPts}" fill="rgba(201,169,110,0.15)" stroke="var(--gold)" stroke-width="2"/>`;

    // Dots on data points
    elements.forEach((e, i) => {
        const r = (count[e] / Math.max(maxVal, 1)) * outerR;
        svg += `<circle cx="${cx + r * Math.cos(angles[i])}" cy="${cy + r * Math.sin(angles[i])}" r="5" fill="var(--gold)"/>`;
    });

    // Labels
    const labelColors = { '木':'#5b8c5a', '火':'#e0503c', '土':'#c9a040', '金':'#d4c8a8', '水':'#4a90d9' };
    elements.forEach((e, i) => {
        const lr = outerR + 30;
        svg += `<text x="${cx + lr * Math.cos(angles[i])}" y="${cy + lr * Math.sin(angles[i])}" 
            text-anchor="middle" dominant-baseline="central"
            fill="${labelColors[e]}" font-size="16" font-weight="700">${e}</text>`;
        const lr2 = outerR + 50;
        svg += `<text x="${cx + lr2 * Math.cos(angles[i])}" y="${cy + lr2 * Math.sin(angles[i])}"
            text-anchor="middle" dominant-baseline="central"
            fill="#9998a8" font-size="12">${count[e]}/${total}</text>`;
    });

    svg += `</svg>`;
    container.innerHTML = svg;
}

/* =============================================================
   STARFIELD ANIMATION
   ============================================================= */
(function() {
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');
    let stars = [];
    let w, h;

    function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // Create stars
    for (let i = 0; i < 120; i++) {
        stars.push({
            x: Math.random() * w,
            y: Math.random() * h,
            r: Math.random() * 1.5 + 0.3,
            opacity: Math.random() * 0.6 + 0.2,
            speed: Math.random() * 0.15 + 0.05,
            twinkleSpeed: Math.random() * 0.02 + 0.005,
            twinkleOffset: Math.random() * Math.PI * 2
        });
    }

    function draw() {
        ctx.clearRect(0, 0, w, h);
        const time = Date.now() * 0.001;

        stars.forEach(star => {
            const twinkle = Math.sin(time * star.twinkleSpeed * 60 + star.twinkleOffset) * 0.3 + 0.7;
            const alpha = star.opacity * twinkle;

            ctx.beginPath();
            ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(232, 224, 208, ${alpha})`;
            ctx.fill();

            // Glow for larger stars
            if (star.r > 1) {
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.r * 2.5, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(201, 169, 110, ${alpha * 0.3})`;
                ctx.fill();
            }
        });

        requestAnimationFrame(draw);
    }
    draw();
})();
